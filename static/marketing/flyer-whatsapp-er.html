<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Foja</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1080px;
            height: 1350px;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #07172b;
            -webkit-font-smoothing: antialiased;
        }

        .flyer {
            width: 1080px;
            height: 1350px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            /* fondo: gradiente sutil con punto de luz central */
            background:
                radial-gradient(ellipse 900px 700px at 50% 45%, #0e2748 0%, #07172b 100%);
        }

        /* textura: líneas diagonales muy sutiles */
        .flyer::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 28px,
                rgba(212, 165, 74, 0.03) 28px,
                rgba(212, 165, 74, 0.03) 29px
            );
            pointer-events: none;
        }

        /* marco dorado fino en los bordes */
        .frame {
            position: absolute;
            inset: 36px;
            border: 1px solid rgba(212, 165, 74, 0.22);
            pointer-events: none;
        }

        .frame::before, .frame::after {
            content: '';
            position: absolute;
            width: 48px;
            height: 48px;
            border-color: #d4a54a;
            border-style: solid;
            opacity: 0.7;
        }

        /* esquinas decorativas */
        .frame::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
        }
        .frame::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
        }

        /* === CONTENIDO === */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 96px;
            width: 100%;
        }

        /* logo pequeño */
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: rgba(212, 165, 74, 0.65);
            margin-bottom: 44px;
        }

        /* divisor ornamental */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 38px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4a54a, transparent);
        }

        .divider-diamond {
            width: 8px;
            height: 8px;
            background: #d4a54a;
            transform: rotate(45deg);
            opacity: 0.9;
        }

        /* titular principal */
        .headline {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 108px;
            line-height: 0.92;
            letter-spacing: -2px;
            color: #f5f1e8;
            margin-bottom: 0;
        }

        .headline strong {
            font-weight: 600;
            display: block;
        }

        .headline em {
            font-style: italic;
            font-weight: 300;
            color: #d4a54a;
            display: block;
            font-size: 96px;
        }

        /* divisor 2 */
        .divider2 {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 320px;
            margin: 38px 0 34px;
        }

        /* subtítulo */
        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-style: italic;
            font-size: 52px;
            line-height: 1.35;
            color: rgba(245, 241, 232, 0.58);
            letter-spacing: 0.2px;
            max-width: 820px;
        }

        /* CTA */
        .cta-wrap {
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .cta-label {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(245, 241, 232, 0.32);
        }

        .cta-url {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 78px;
            letter-spacing: -0.5px;
            color: #d4a54a;
            line-height: 1;
            border-bottom: 2px solid rgba(212, 165, 74, 0.4);
            padding-bottom: 6px;
        }

    </style>
</head>
<body>
<div class="flyer">
    <!-- marcos de esquina -->
    <div class="frame"></div>

    <div class="content">

        <div class="logo">Foja</div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line"></div>
        </div>

        <h1 class="headline">
            <strong>Todas las fojas.</strong>
            <em>Un solo PDF.</em>
        </h1>

        <div class="divider2 divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line"></div>
        </div>

        <p class="subtitle">
            Descargá expedientes completos<br>
            en un solo archivo listo para leer.
        </p>

        <div class="cta-wrap">
            <span class="cta-label">Accedé en</span>
            <span class="cta-url">foja.com.ar</span>
        </div>

    </div>
</div>
</body>
</html>
